version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      nestjs: { patterns: ["@nestjs/*"] }
      prisma: { patterns: ["prisma", "@prisma/*"] }
      next-react:
        { patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"] }
      tanstack: { patterns: ["@tanstack/*"] }
      tooling: { patterns: ["eslint", "typescript*", "prettier", "vitest", "@playwright/*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
