name: Deploy

# Production deployment is explicit: a person starts it, and the `production` environment
# requires reviewer approval (configure in Settings → Environments). It deploys only `main`,
# and only a commit whose CI run passed.
on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  id-token: write # Sigstore signing for build provenance
  attestations: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Oracle Linux VPS
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, neural-frontier]
    timeout-minutes: 30
    environment:
      name: production
      url: https://192.168.197.100:8643
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Require a green CI run for this exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=CI%20passed"
          conclusion=$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$url" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const r=JSON.parse(d).check_runs;console.log(r.length?r[0].conclusion:"missing")})')
          echo "CI conclusion for ${GITHUB_SHA}: ${conclusion}"
          [[ "$conclusion" == "success" ]] || { echo "::error::CI has not passed for this commit"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Built on the production OS with the production Node.js runtime, from the locked
      # dependency tree, so native/platform-specific files match exactly.
      - name: Install (locked)
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Unit tests (release gate)
        run: npm test

      - name: Package build output
        id: pkg
        run: |
          RELEASE_ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::12}"
          tar --sort=name --mtime="@0" --owner=0 --group=0 --numeric-owner \
            --exclude='apps/web/.next/cache' \
            -czf "neural-frontier-${RELEASE_ID}.tgz" \
            package.json package-lock.json apps/api/dist apps/web/.next apps/web/next.config.mjs \
            packages/contracts/dist packages/db/dist packages/db/prisma
          sha256sum "neural-frontier-${RELEASE_ID}.tgz" | tee "neural-frontier-${RELEASE_ID}.tgz.sha256"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "artifact=neural-frontier-${RELEASE_ID}.tgz" >> "$GITHUB_OUTPUT"

      - name: Sign build provenance (Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pkg.outputs.artifact }}

      - name: Migrate, release, health-check (auto-rollback)
        run: bash deploy/oracle-linux/scripts/deploy.sh "$GITHUB_WORKSPACE" "${{ steps.pkg.outputs.release_id }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Neural Frontier deployment"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Release: \`${{ steps.pkg.outputs.release_id }}\`"
            echo "- Artifact SHA-256: \`$(cut -d' ' -f1 "${{ steps.pkg.outputs.artifact }}.sha256" 2>/dev/null)\`"
            echo "- Result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
