# Neural Frontier login theme for Keycloak 26 (original design; matches the Admin Center).
# Inherits every page body from the built-in "keycloak" theme and replaces the layout
# (template.ftl), the styling and the icons. No PatternFly or Font Awesome is loaded.
parent=keycloak
import=common/keycloak

stylesCommon=
styles=css/nf.css
scripts=js/nf.js

meta=viewport==width=device-width,initial-scale=1 theme-color==#0d1020

kcHtmlClass=nf-html
kcBodyClass=nf-body
kcLoginClass=nf-shell

# Icons: CSS-masked inline SVG (see nf.css) instead of icon fonts.
kcFormPasswordVisibilityButtonClass=nf-reveal
kcFormPasswordVisibilityIconShow=nf-i nf-i-eye
kcFormPasswordVisibilityIconHide=nf-i nf-i-eye-off
kcFeedbackErrorIcon=nf-i nf-i-alert
kcFeedbackWarningIcon=nf-i nf-i-alert
kcFeedbackSuccessIcon=nf-i nf-i-check
kcFeedbackInfoIcon=nf-i nf-i-info
kcResetFlowIcon=nf-i nf-i-swap
kcWebAuthnKeyIcon=nf-i nf-i-key
kcWebAuthnDefaultIcon=nf-i nf-i-key
kcLoginOTPListItemIconClass=nf-i nf-i-phone
kcSelectAuthListItemArrowIconClass=nf-i nf-i-chevron

# Layout classes the page bodies use, mapped to Neural Frontier components.
kcFormCardClass=nf-card
kcFormHeaderClass=nf-card-header
kcFormClass=nf-form
kcFormGroupClass=nf-field
kcFormGroupErrorClass=nf-field-error
kcLabelWrapperClass=nf-label-row
kcLabelClass=nf-label
kcInputWrapperClass=nf-input-row
kcInputClass=nf-input
kcInputGroup=nf-input-group
kcInputErrorMessageClass=nf-error-text
kcInputHelperTextBeforeClass=nf-help
kcInputHelperTextAfterClass=nf-help
kcFormOptionsClass=nf-options
kcFormOptionsWrapperClass=nf-options-links
kcFormButtonsClass=nf-buttons
kcFormSettingClass=nf-settings
kcButtonClass=nf-btn
kcButtonPrimaryClass=nf-btn-primary
kcButtonDefaultClass=nf-btn-secondary
kcButtonBlockClass=nf-btn-block
kcButtonLargeClass=nf-btn-lg
kcInputLargeClass=nf-input-lg
kcAlertClass=nf-alert
kcAlertTitleClass=nf-alert-text
kcSignUpClass=nf-signup
kcContentWrapperClass=nf-content-wrapper
kcInputClassCheckbox=nf-check
kcInputClassCheckboxInput=nf-check-input
kcInputClassCheckboxLabel=nf-check-label
kcInputClassRadio=nf-radio
kcInputClassRadioInput=nf-radio-input
kcInputClassRadioLabel=nf-radio-label
kcLoginOTPListClass=nf-otp-device
kcLoginOTPListInputClass=nf-otp-device-input
kcLoginOTPListItemHeaderClass=nf-otp-device-header
kcLoginOTPListItemIconBodyClass=nf-otp-device-icon
kcLoginOTPListItemTitleClass=nf-otp-device-title
kcFormSocialAccountSectionClass=nf-social
kcFormSocialAccountListClass=nf-social-list
kcFormSocialAccountListButtonClass=nf-btn nf-btn-secondary nf-btn-block
kcSelectAuthListClass=nf-auth-list
kcSelectAuthListItemClass=nf-auth-item
kcSelectAuthListItemIconClass=nf-auth-icon
kcSelectAuthListItemBodyClass=nf-auth-body
kcSelectAuthListItemHeadingClass=nf-auth-title
kcSelectAuthListItemDescriptionClass=nf-auth-desc
kcSelectAuthListItemArrowClass=nf-auth-arrow
kcSrOnlyClass=nf-sr-only
