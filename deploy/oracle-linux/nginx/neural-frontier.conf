# Neural Frontier — Admin Center (Next.js :3400) and API (NestJS :3401).
#
# HTTPS on :8643 with a self-signed certificate until a domain exists; plain :8280 redirects
# there. Session cookies are __Host- (Secure), so sign-in only works over HTTPS.
# When a domain is chosen: replace the certificate (Let's Encrypt), move to 443, enable HSTS.

limit_req_zone $binary_remote_addr zone=nf_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=nf_api:10m rate=20r/s;

upstream nf_web { server 127.0.0.1:3400; keepalive 16; }
upstream nf_api { server 127.0.0.1:3401; keepalive 16; }
upstream nf_idp { server 127.0.0.1:8481; keepalive 8; }

server {
    listen 8280;
    listen [::]:8280;
    server_name _;
    server_tokens off;
    return 308 https://$host:8643$request_uri;
}

server {
    listen 8643 ssl;
    listen [::]:8643 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/pki/tls/neural-frontier/selfsigned.crt;
    ssl_certificate_key /etc/pki/tls/neural-frontier/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:nf_ssl:5m;
    ssl_session_timeout 1h;
    # No HSTS while the certificate is self-signed.

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite (never append) so clients cannot spoof their address.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    # Operational endpoints are never public.
    location = /api/metrics { return 404; }
    location ^~ /api/docs  { return 404; }

    location ^~ /api/v1/auth/ {
        limit_req zone=nf_auth burst=10 nodelay;
        proxy_pass http://nf_api;
    }

    location ^~ /api/ {
        limit_req zone=nf_api burst=40 nodelay;
        proxy_pass http://nf_api;
    }

    # Self-hosted identity provider (Keycloak). The admin console is reachable only from
    # private networks; sign-in pages and OIDC endpoints are public.
    location ^~ /auth/admin/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://nf_idp;
    }

    location ^~ /auth/resources/ {
        proxy_pass http://nf_idp;
        expires 7d;
    }

    location ^~ /auth/ {
        limit_req zone=nf_auth burst=20 nodelay;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_pass http://nf_idp;
    }

    location ^~ /_next/static/ {
        proxy_pass http://nf_web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://nf_web;
    }
}
